<svg width="100%" viewBox="0 0 1000 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0b14"/><stop offset="50%" stop-color="#151726"/><stop offset="100%" stop-color="#0a0b14"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/><stop offset="50%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#7dcfff"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="80" rx="14" fill="url(#bg)"/>
  <rect x="40" y="39" width="0" height="2" rx="1" fill="url(#shine)">
    <animate attributeName="width" values="0;280.0" dur="1.5s" fill="freeze"/>
  </rect>
  <rect x="680.0" y="39" width="0" height="2" rx="1" fill="url(#shine)">
    <animate attributeName="width" values="0;280.0" dur="1.5s" fill="freeze"/>
  </rect>
  <circle cx="334.0" cy="40" r="3" fill="#7dcfff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="666.0" cy="40" r="3" fill="#7dcfff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="500" y="49" text-anchor="middle" textLength="264" lengthAdjust="spacing" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="url(#shine)">THE  NUMBERS</text>
</svg>
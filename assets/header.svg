<svg width="100%" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="frame"><rect width="1000" height="340" rx="20"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c18"/><stop offset="100%" stop-color="#14162a"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0%" stop-color="#ff9e64"/><stop offset="100%" stop-color="#ff9e64" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0%" stop-color="#f7768e"/><stop offset="100%" stop-color="#f7768e" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4"><stop offset="0%" stop-color="#7dcfff"/><stop offset="100%" stop-color="#7dcfff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b5"><stop offset="0%" stop-color="#7aa2f7"/><stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0b0c18" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#0b0c18" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b0c18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/><stop offset="25%" stop-color="#bb9af7"/><stop offset="50%" stop-color="#7dcfff"/>
      <stop offset="75%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#7aa2f7"/>
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7aa2f7" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#bg)"/>

    <!-- vivid iridescent ribbons -->
    <g filter="url(#soft)" opacity="0.95">
      <ellipse cx="110" cy="270" rx="430" ry="175" fill="url(#b1)">
        <animateTransform attributeName="transform" type="rotate" values="-12 110 270;10 110 270;-12 110 270" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="890" cy="60" rx="420" ry="165" fill="url(#b2)">
        <animateTransform attributeName="transform" type="rotate" values="8 890 60;-12 890 60;8 890 60" dur="19s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="360" cy="10" rx="340" ry="140" fill="url(#b3)">
        <animateTransform attributeName="transform" type="translate" values="0 0;60 25;0 0" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="720" cy="340" rx="400" ry="150" fill="url(#b4)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-70 -20;0 0" dur="17s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="40" cy="30" rx="280" ry="130" fill="url(#b5)">
        <animateTransform attributeName="transform" type="translate" values="0 0;40 30;0 0" dur="12s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="1000" height="340" fill="url(#grid)"/>
    <rect width="1000" height="340" fill="url(#vignette)"/>

    <!-- circuit traces -->
    <g stroke="#7aa2f7" stroke-opacity="0.5" stroke-width="1.5" fill="none">
      <path id="c1" d="M0 95 H170 L215 140 H350 L385 175 H440"/>
      <path id="c2" d="M1000 250 H830 L785 205 H650 L615 170 H560"/>
      <path id="c3" d="M0 290 H110 L145 255 H225"/>
      <path id="c4" d="M1000 65 H905 L870 100 H775"/>
      <path id="c5" d="M250 340 V300 L285 265 H330"/>
      <path id="c6" d="M750 0 V40 L715 75 H670"/>
    </g>
    <g fill="#7dcfff" opacity="0.9">
      <circle cx="440" cy="175" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="170" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="225" cy="255" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="775" cy="100" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="265" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="670" cy="75" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
    <!-- sparks travelling along traces -->
    <g fill="#ffffff" filter="url(#spark)">
      <circle r="2.6"><animateMotion dur="5s" repeatCount="indefinite"><mpath xlink:href="#c1"/></animateMotion></circle>
      <circle r="2.6"><animateMotion dur="6s" begin="1s" repeatCount="indefinite"><mpath xlink:href="#c2"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="3.5s" begin="0.5s" repeatCount="indefinite"><mpath xlink:href="#c3"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="4s" begin="2s" repeatCount="indefinite"><mpath xlink:href="#c4"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#c5"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="3.2s" begin="2.5s" repeatCount="indefinite"><mpath xlink:href="#c6"/></animateMotion></circle>
    </g>

    <!-- floating particles -->
    <g fill="#c0caf5">
      <circle cx="150" cy="300" r="2"><animate attributeName="cy" values="330;10" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="310" r="1.8"><animate attributeName="cy" values="340;0" dur="13s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="320" r="2"><animate attributeName="cy" values="340;20" dur="11s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="300" r="1.8"><animate attributeName="cy" values="330;15" dur="12s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- name + tagline -->
    <text x="500" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="3" fill="url(#shine)" filter="url(#glow)">HI, I'M ASHISH</text>
    <text x="500" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="1" fill="#e0e6ff">
      Building the AI data tools I always wished existed
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.33;1" dur="2.1s" begin="0s" fill="freeze"/>
    </text>
    <rect x="240" y="236" height="3" rx="1.5" width="520" fill="url(#shine)">
      <animate attributeName="width" values="0;0;520" keyTimes="0;0.52;1" dur="2.5s" begin="0s" fill="freeze"/>
    </rect>
  </g>
</svg>
